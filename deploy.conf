# Motor Guard deploy config — the ONLY file you edit per release.

# Branch in the app repo (PM-Maestro-ITI-GP-Org/Android) that holds the FINAL
# application. When your friends finish on a new branch, set this to its name
# and re-run ./deploy.sh. The app/ submodule is checked out to this branch's tip.
APP_BRANCH=main

# Absolute path to your AOSP 15 (raspberry-vanilla) tree. Must contain build/envsetup.sh.
AOSP_ROOT=/media/gemy/Embedded_Linux/Android/AOSP15

# The 3D vehicle model the Diagnostics screen renders, as a path under vehicle3dModel/
# in the app branch. deploy.sh installs it as app/src/main/assets/car_model.glb — the
# app branch .gitignores that file (15 MB of binary), so the AOSP build has to put it
# there itself. This is the in-tree equivalent of MotorGuardApp/scripts/select-car-model.sh.
#
# The model is CC-BY-4.0: if you change it, update vehicle3dModel/MODEL_LICENSE.md and
# Car3dTuning.MODEL_CREDIT on the app branch too — the credit is shown under the car.
# diag_v2, not texture1k: the v1/v2 exports are the models with the motor and battery pack
# baked in (Comp_Motor/Comp_Battery) and the cutaway zones (Zone_Motor/Zone_Battery) that
# CutawayZones fades open when those hotspots are focused. texture1k is the plain Porsche
# shell — no zone nodes, no internal parts — so with it installed the battery/motor presses
# show nothing but the outer surface. The diag models carry no brake/door geometry, so the
# Brakes/Doors hotspots use the bbox FALLBACK anchors; the cutaway and the framed
# battery/motor anchors are the feature that matters. 2k looks no different at this panel
# size and costs 2 MB more.
CAR_MODEL=porsche_mission_e/porsche_mission_e_diag_v2.glb
